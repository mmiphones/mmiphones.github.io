<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MM iPhones">
<title>MM iPhones</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .carregando { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center; }
  .spin { width: 34px; height: 34px; border: 3px solid #444; border-top-color: #f5c518; border-radius: 50%; animation: g 0.9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #f5c518; color: #111; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
<div class="carregando" id="tela-carregando">
  <div class="spin"></div>
  <div id="msg">Carregando MM iPhones…</div>
</div>

<script>
/*
 * MM iPhones — página hospedada no GitHub Pages.
 *
 * Esta página NÃO tem o app dentro dela: ela busca a versão mais recente do app
 * direto do Google Apps Script (Index.html) e conversa com o servidor sem usar
 * o login Google do navegador. Por isso não trava com várias contas Google.
 *
 * Melhorias no app: faça no Apps Script e publique uma "Nova versão" na
 * implantação existente. Este arquivo só precisa mudar se o link /exec mudar.
 */
(function () {
  // Link do app da Web (Apps Script > Implantar > Gerenciar implantações > URL)
  var URL_APP = 'https://script.google.com/macros/s/AKfycbxX9QfR0Hx2y_ZCdru5qqCWDwY-Xg1xjUiNEs9kRqR1NmjtTvHERwFVjMKA6z_hUsqrGw/exec';

  function chamarServidor(fn, args) {
    return fetch(URL_APP, {
      method: 'POST',
      credentials: 'omit',              // não envia os cookies/contas Google do navegador
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args })
    }).then(function (r) { return r.json(); });
  }

  // Substitui o google.script.run do Apps Script por chamadas via fetch.
  function criarRunner(ok, falha) {
    return new Proxy({}, {
      get: function (_, prop) {
        if (prop === 'withSuccessHandler') return function (h) { return criarRunner(h, falha); };
        if (prop === 'withFailureHandler') return function (h) { return criarRunner(ok, h); };
        if (prop === 'withUserObject') return function () { return criarRunner(ok, falha); };
        return function () {
          var args = Array.prototype.slice.call(arguments);
          chamarServidor(String(prop), args).then(function (r) {
            if (r && r.ok) { if (ok) ok(r.res); }
            else if (falha) falha(new Error((r && r.erro) || 'Erro no servidor.'));
          }).catch(function () {
            if (falha) falha(new Error('Sem conexão com o servidor. Verifique a internet e tente de novo.'));
          });
        };
      }
    });
  }

  window.google = {
    script: {
      run: criarRunner(null, null),
      host: { close: function () {}, setHeight: function () {}, setWidth: function () {}, editor: { focus: function () {} } }
    }
  };

  function erro() {
    document.getElementById('tela-carregando').innerHTML =
      '<div>Não foi possível carregar o app.<br>Verifique a internet.</div>' +
      '<button onclick="location.reload()">Tentar de novo</button>';
  }

  fetch(URL_APP + '?formato=html', { credentials: 'omit', cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      if (!/<html|<!doctype/i.test(html.slice(0, 1000))) throw new Error('resposta inesperada');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(erro);
})();
</script>
</body>
</html>
